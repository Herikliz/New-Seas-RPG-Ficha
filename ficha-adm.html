<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha (ADM)</title>
</head>
<body>
<!--
    FICHA EM MODO ADM
    Este arquivo não tem a ficha dentro dele: ele só abre o index.html (a ficha normal) com o
    "modo ADM" ligado, então qualquer mudança no index.html, script.js e style.css vale aqui também.
    No modo ADM, toda pergunta de senha é respondida sozinha com a senha ADM.

    Funciona aberto direto do computador (dois cliques no arquivo). Basta deixá-lo na MESMA PASTA
    do index.html. Para usar a ficha que está publicada na internet em vez da cópia do computador,
    troque o endereço abaixo, por exemplo:
        var FICHA = 'https://herikliz.github.io/New-Seas-RPG-Ficha/index.html';
    (neste caso a ficha publicada precisa ter o script.js novo).
-->
<script>
    var FICHA = 'index.html';
    window.location.replace(FICHA + '#Ben10');
</script>
<noscript>Ative o JavaScript para abrir a ficha.</noscript>
</body>
</html>
